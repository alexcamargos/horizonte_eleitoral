[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horizonte-eleitoral"
version = "0.1.0"
description = "Fundacao reproduzivel para o sistema de projecao eleitoral de 2026."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "httpx2>=2.13.1",
    "numpy>=2.0.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.10.0",
    "scipy>=1.14.0",
    "streamlit>=1.40.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8",
]

[project.scripts]
horizonte-eleitoral = "horizonte_eleitoral.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true

[tool.uv.workspace]
members = [
    "horizonte_eleitoral",
]
